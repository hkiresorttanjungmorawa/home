<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Pro - Analisis & Riwayat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-finance: #0f172a;
            --card-bg: #1e293b;
            --emerald-money: #10b981;
            --rose-expense: #f43f5e;
            --gold-accent: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-finance); color: var(--text-light); padding: 16px; display: flex; justify-content: center; }
        .phone-wrapper { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
        header { margin: 15px 0 25px 0; display: flex; align-items: center; justify-content: space-between; }
        header h2 { font-size: 20px; font-weight: 700; }
        .btn-back { background-color: var(--card-bg); color: var(--text-light); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid #334155; }
        
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .summary-box { background-color: var(--card-bg); padding: 12px 8px; border-radius: 14px; border: 1px solid #334155; text-align: center; }
        .summary-box .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .summary-box .value { font-size: 13px; font-weight: 700; margin-top: 4px; }
        .summary-box .value.in { color: var(--emerald-money); }
        .summary-box .value.out { color: var(--rose-expense); }
        .summary-box .value.pend { color: var(--gold-accent); }

        .chart-card { background-color: var(--card-bg); border-radius: 18px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 15px; text-align: center; }
        .chart-container { position: relative; width: 100%; max-height: 220px; display: flex; justify-content: center; }
        #loading-status { text-align: center; color: #94a3b8; font-style: italic; margin: 40px 0; font-size: 14px; }
        
        .transaction-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background-color: var(--card-bg); border-radius: 12px; border: 1px solid #334155; }
        .item-info .title { font-size: 14px; font-weight: 500; }
        .item-info .date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .item-amount { font-size: 14px; font-weight: 600; }
        .item-amount.income { color: var(--emerald-money); }
        .item-amount.expense { color: var(--rose-expense); }
        .item-amount.pending { color: var(--gold-accent); }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <header>
        <h2>Analisis & Riwayat 📊</h2>
        <a href="index.html" class="btn-back">⬅️ Kembali</a>
    </header>

    <div class="summary-grid">
        <div class="summary-box">
            <div class="label">Semua Masuk</div>
            <div id="month-income" class="value in">Rp 0</div>
        </div>
        <div class="summary-box">
            <div class="label">Semua Keluar</div>
            <div id="month-expense" class="value out">Rp 0</div>
        </div>
        <div class="summary-box">
            <div class="label">Total Transit</div>
            <div id="month-pending" class="value pend">Rp 0</div>
        </div>
    </div>

    <div class="chart-card" id="chart-box" style="display: none;">
        <div class="chart-title">Proporsi Arus Kas Global</div>
        <div class="chart-container">
            <canvas id="ratioChart"></canvas>
        </div>
    </div>

    <div id="loading-status">Sedang mengunduh dan menganalisis data...</div>
    <ul id="transaction-list" class="transaction-list"></ul>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfImd3maczBiWntXKsnGvH-2hC9NqX_C0H3PPRVhChCE0Z7gKVVE7R1Qu4YuGob_TD/exec';

    const transactionList = document.getElementById('transaction-list');
    const loadingStatus = document.getElementById('loading-status');
    const monthIncomeEl = document.getElementById('month-income');
    const monthExpenseEl = document.getElementById('month-expense');
    const monthPendingEl = document.getElementById('month-pending');
    const chartBox = document.getElementById('chart-box');
    
    let ratioChartInstance = null;

    function formatRupiah(angka) {
        return 'Rp ' + parseInt(angka).toLocaleString('id-ID');
    }

    function renderChart(pemasukan, pengeluaran, pending) {
        const ctx = document.getElementById('ratioChart').getContext('2d');
        if (ratioChartInstance) { ratioChartInstance.destroy(); }

        if (pemasukan === 0 && pengeluaran === 0 && pending === 0) {
            chartBox.style.display = 'none';
            return;
        }

        chartBox.style.display = 'block';
        ratioChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Pemasukan', 'Pengeluaran', 'Transit (Pending)'],
                datasets: [{
                    data: [pemasukan, pengeluaran, pending],
                    backgroundColor: ['#10b981', '#f43f5e', '#f59e0b'],
                    borderWidth: 2,
                    borderColor: '#1e293b'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f8fafc', font: { family: 'Inter', size: 11 } } }
                }
            }
        });
    }

    function initHistory() {
        const cacheBusterUrl = SCRIPT_URL + '?_ts=' + new Date().getTime();

        fetch(cacheBusterUrl)
        .then(response => response.json())
        .then(data => {
            loadingStatus.style.display = 'none';
            transactionList.innerHTML = '';

            if (!data || data.length === 0) {
                transactionList.innerHTML = '<li style="text-align:center; color:#6b7280; font-size:13px;">Belum ada data.</li>';
                return;
            }

            let totalPemasukan = 0;
            let totalPengeluaran = 0;
            let totalPending = 0;

            const displayData = [...data].reverse();

            displayData.forEach(transaksi => {
                let tanda = '-';
                let kelasNominal = 'expense';
                let teksBadge = 'Keluar';

                // Menyesuaikan dengan variabel baru berbahasa Indonesia
                if (transaksi.jenis === 'Pemasukan') {
                    tanda = '+'; kelasNominal = 'income'; teksBadge = 'Masuk';
                } else if (transaksi.jenis === 'Pending') {
                    tanda = '⏳'; kelasNominal = 'pending'; teksBadge = 'Transit';
                }

                const li = document.createElement('li');
                li.classList.add('transaction-item');
                li.innerHTML = `
                    <div class="item-info">
                        <div class="title">${transaksi.keterangan}</div>
                        <div class="date">Dana ${teksBadge}</div>
                    </div>
                    <div class="item-amount ${kelasNominal}">${tanda} ${formatRupiah(transaksi.jumlah)}</div>
                `;
                transactionList.appendChild(li);
            });

            data.forEach(transaksi => {
                const nominal = parseInt(transaksi.jumlah) || 0;
                if (transaksi.jenis === 'Pemasukan') totalPemasukan += nominal;
                else if (transaksi.jenis === 'Pengeluaran') totalPengeluaran += nominal;
                else if (transaksi.jenis === 'Pending') totalPending += nominal;
            });

            monthIncomeEl.innerText = formatRupiah(totalPemasukan);
            monthExpenseEl.innerText = formatRupiah(totalPengeluaran);
            monthPendingEl.innerText = formatRupiah(totalPending);

            renderChart(totalPemasukan, totalPengeluaran, totalPending);
        })
        .catch(error => {
            console.error('Error:', error);
            loadingStatus.innerText = '⚠️ Gagal memuat analisis riwayat.';
        });
    }

    initHistory();
</script>
</body>
</html>
